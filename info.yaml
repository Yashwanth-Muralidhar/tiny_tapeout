# Tiny Tapeout project information
project:
  title:        "ML-KEM Decapsulation - FO Backend"
  author:       "H Vinayaka"
  discord:      ""
  description:  "Fujisaki-Okamoto backend of ML-KEM decapsulation: ByteDecode, (de)compression, coefficient comparison, coefficient-count integrity check, implicit rejection. Runtime param select for ML-KEM 512/768/1024."
  language:     "Verilog"
  clock_hz:     40000000
  tiles: "1x1"
  top_module:  "tt_um_vinayaka_pqc_fo"
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  ui[0]: "data in [0]"
  ui[1]: "data in [1]"
  ui[2]: "data in [2]"
  ui[3]: "data in [3]"
  ui[4]: "data in [4]"
  ui[5]: "data in [5]"
  ui[6]: "data in [6]"
  ui[7]: "data in [7]"

  uo[0]: "MATCH"
  uo[1]: "FAULT"
  uo[2]: "stream out [2]"
  uo[3]: "stream out [3]"
  uo[4]: "stream out [4]"
  uo[5]: "stream out [5]"
  uo[6]: "stream out [6]"
  uo[7]: "stream out [7]"

  uio[0]: "wr (in)"
  uio[1]: "start (in)"
  uio[2]: "rd (in)"
  uio[3]: "phase (in)"
  uio[4]: "param_sel[0] (in)"
  uio[5]: "param_sel[1] (in)"
  uio[6]: "BUSY (out)"
  uio[7]: "FAULT (out)"

# Do not change!
yaml_version: 6
