# Tiny Tapeout project metadata
project:
  title:        "ML-KEM Decapsulation - Fujisaki-Okamoto Backend"
  author:       "H Vinayaka"
  discord:      ""
  description:  "FO backend of ML-KEM decapsulation: ByteDecode, (de)compression, coefficient comparison, coefficient-count integrity check, implicit-rejection decision. Runtime param select for ML-KEM 512/768/1024."
  language:     "Verilog"
  clock_hz:     40000000
  tiles:        "1x1"
  top_module:   "tt_um_vinayaka_pqc_fo"
  source_files:
    - "project.v"

# Pinout - documentation only (must match RTL behavior)
pinout:
  ui:
    - "data[0]"
    - "data[1]"
    - "data[2]"
    - "data[3]"
    - "data[4]"
    - "data[5]"
    - "data[6]"
    - "data[7]"
  uo:
    - "MATCH (match_r)"
    - "FAULT (fault)"
    - "stream_out[2]"
    - "stream_out[3]"
    - "stream_out[4]"
    - "stream_out[5]"
    - "stream_out[6]"
    - "stream_out[7]"
  uio:
    - "wr (in)"
    - "start (in)"
    - "rd (in)"
    - "phase (in)"
    - "param_sel[0] (in)"
    - "param_sel[1] (in)"
    - "BUSY (out)"
    - "FAULT (out)"
