# Tiny Tapeout project information
project:
  title:        "Compact Fault-Aware FO Verification for ML-KEM"
  author:       "Yashwanth Muralidhar"
  discord:      ""
  description:  "A compact, constant-latency, divider-free FO verification datapath for ML-KEM decapsulation."
  language:     "Verilog"
  clock_hz:     40000000
  tiles: "1x2"
  top_module:  "tt_um_vinayaka_pqc_fo"
  source_files:
    - "project.v"

# Current Architecture-G baseline pinout.
# The final six-functional-pin interface is a separate optimization target and
# should not be claimed as implemented until that RTL is frozen and verified.
pinout:
  # Dedicated inputs
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Dedicated outputs
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "MATCH"
  uo[7]: "FAULT"

  # Bidirectional pins
  uio[0]: "WR"
  uio[1]: "START"
  uio[2]: "RD"
  uio[3]: "PHASE"
  uio[4]: "PARAM[0]"
  uio[5]: "PARAM[1]"
  uio[6]: "BUSY"
  uio[7]: "FAULT_STATUS"

yaml_version: 6
